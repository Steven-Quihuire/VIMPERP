services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vimcore
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vimcore']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
