# OpenSpec SDD configuration — vimcore
schema: spec-driven

context: |
  Project: vimcore at /home/linux/Vimcore (git repo).
  Stack: pnpm workspace + Turbo monorepo, TypeScript only.
  Frontend: React 19 + Vite + React Router 7 + TanStack Query + Zustand + React Hook Form + Zod + Tailwind 4.
  Backend: Node + Express 5 + Drizzle ORM + PostgreSQL + Pino + Zod.
  Architecture: feature-first vertical slices with domain/application/infrastructure/presentation across apps/api and apps/web.
  Quality: ESLint 9 shared configs, TypeScript 5.9 typecheck, Prettier 3.6, Docker Compose for local Postgres.
  Testing: Vitest at root/apps, Playwright E2E, Supertest available in api, API coverage via V8 thresholds.
  Artifact store: openspec (repo-local source of truth; Engram stores session context only).

rules:
  workflow:
    - Keep one active change per feature boundary; do not append unrelated work to an existing change.
    - Split deferred work into a new change instead of leaving unchecked tasks in an old change.
    - Archive only after persisted tasks are complete and verification has passed.
  proposal:
    - Include rollback plan for risky changes
    - Distinguish detected facts from proposed defaults; confirm the stack before apply
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Follow feature-first vertical slices (domain/application/infrastructure/presentation)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Bootstrap task must establish test runner before any implementation task
  apply:
    guidelines:
      - Follow existing code patterns
      - TypeScript only; pnpm only; no Axios; PostgreSQL + Drizzle only on the backend
    tdd: true
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  detected: "2026-08-01"
  runner:
    command: "pnpm test"
    framework: vitest
  layers:
    unit: true
    integration: true
    e2e: true
  coverage:
    available: true
    command: "pnpm --filter api test:coverage"
  quality:
    linter: true
    type_checker: true
    formatter: true
